# ============================================================
#  Golden Touch 1127 · nginx · rendimiento de carga
#
#  PROBLEMA (medido el 17/09/2026): nginx comprimía solo el HTML. Los JS y CSS
#  salían crudos (index 122 kB en vez de 37 kB; Tesorería 325 kB; xlsx 870 kB),
#  y el sitio respondía por HTTP/1.1.
#
#  CÓMO APLICARLO (en el Droplet, como root):
#    1) Copiar este archivo:
#         cp /var/www/Golden-Touch-1127-CA/deploy/nginx-rendimiento.conf \
#            /etc/nginx/conf.d/gt-rendimiento.conf
#       (conf.d se incluye dentro de `http {}`: las directivas gzip valen para todo.)
#    2) En el bloque `server` del sitio (sites-enabled), en la línea de HTTPS:
#         listen 443 ssl;        →   listen 443 ssl http2;
#       (y lo mismo en la de IPv6: `listen [::]:443 ssl http2;`)
#    3) Probar y recargar:
#         nginx -t && systemctl reload nginx
#    4) Verificar (debe decir `Content-Encoding: gzip`):
#         curl -sI -H 'Accept-Encoding: gzip' https://sistema.goldentouch1127.com/assets/$(ls /var/www/Golden-Touch-1127-CA/dist/assets | grep -m1 '^index-.*\.js$') | grep -i encoding
#
#  Si Ubuntu ya trae `gzip on;` en nginx.conf, no pasa nada: acá no se repite
#  `gzip on` (nginx no acepta la directiva duplicada en el mismo bloque); solo se
#  agrega lo que falta. Si `nginx -t` avisa "gzip ... is duplicate", borrar esa
#  línea de este archivo.
# ============================================================

# Servir el `.gz` precomprimido que genera el build (vite.config.ts) cuando exista.
gzip_static on;

# Para lo que no tenga `.gz` (respuestas chicas, version.json…): comprimir al vuelo.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/manifest+json
  image/svg+xml;
